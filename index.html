<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swathi's Closet Store</title>
    <!-- Tailwind CSS for clean, modern boutique styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800">

    <!-- Header Section -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-wide text-stone-900">Swathi's Closet</h1>
            <a href="https://wa.me/919999999999" target="_blank" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-emerald-700 transition">
                WhatsApp Inquiry
            </a>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="bg-stone-900 text-white py-16 px-4 text-center">
        <h2 class="text-3xl md:text-5xl font-serif mb-4">Timeless Elegance, Crafted for You</h2>
        <p class="text-stone-300 max-w-xl mx-auto text-sm md:text-base">Explore our exclusive collection of designer party wear, elegant ethnic kurtis, and festive gowns.</p>
    </section>

    <!-- Catalog Grid Section -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <h3 class="text-2xl font-serif mb-8 text-stone-900 border-b pb-3">Latest Arrivals</h3>
        
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="text-center py-12 col-span-full text-stone-500">Loading catalog...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-stone-900 text-stone-400 py-8 text-center text-sm">
        <p>&copy; 2026 Swathi's Closet Store. All rights reserved.</p>
    </footer>

    <!-- Bulletproof CSV Parser Script -->
    <script>
        async function loadCatalog() {
            try {
                const response = await fetch('products.csv');
                if (!response.ok) throw new Error('Could not load products.csv');
                const csvText = await response.text();
                
                const lines = csvText.trim().split('\n');
                if (lines.length < 2) return;

                const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
                
                const getColIndex = (names) => {
                    for (let n of names) {
                        const idx = headers.findIndex(h => h.includes(n));
                        if (idx !== -1) return idx;
                    }
                    return -1;
                };

                const idxTitle = getColIndex(['title', 'name']);
                const idxPrice = getColIndex(['price']);
                const idxCategory = getColIndex(['category']);
                const idxColor = getColIndex(['color']);
                const idxSizes = getColIndex(['size']);
                const idxRemarks = getColIndex(['remark']);
                // Expanded search terms for image column (checks 'image', 'img', 'photo', 'file', or fallback to last column)
                let idxImage = getColIndex(['imag', 'photo', 'file', 'pic']);
                if (idxImage === -1 && headers.length >= 8) idxImage = 7; // default to 8th column if standard template

                const productGrid = document.getElementById('product-grid');
                productGrid.innerHTML = '';

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const cols = [];
                    let current = '';
                    let inQuotes = false;
                    for (let char of line) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            cols.push(current.trim().replace(/^"|"$/g, ''));
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    cols.push(current.trim().replace(/^"|"$/g, ''));

                    const title = idxTitle !== -1 && cols[idxTitle] ? cols[idxTitle] : 'Boutique Wear';
                    const price = idxPrice !== -1 && cols[idxPrice] ? cols[idxPrice] : '0';
                    const category = idxCategory !== -1 && cols[idxCategory] ? cols[idxCategory] : 'Ethnic';
                    const color = idxColor !== -1 && cols[idxColor] ? cols[idxColor] : 'Standard';
                    const sizes = idxSizes !== -1 && cols[idxSizes] ? cols[idxSizes] : 'Standard';
                    const remarks = idxRemarks !== -1 && cols[idxRemarks] ? cols[idxRemarks] : '';
                    let rawImage = idxImage !== -1 && cols[idxImage] ? cols[idxImage] : '';

                    // Clean image filename and build correct path
                    rawImage = rawImage.replace(/^images\//, '').trim();
                    const imagePath = rawImage ? `images/${rawImage}` : '';

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col justify-between border border-stone-100";
                    
                    card.innerHTML = `
                        <div class="relative bg-stone-100 h-80 overflow-hidden">
                            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-stone-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">
                                ${category}
                            </span>
                            <img src="${imagePath}" alt="${title}" class="w-full h-full object-cover object-top hover:scale-105 transition duration-500" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&q=80&w=600'; console.log('Failed to load image:', '${imagePath}');">
                        </div>
                        <div class="p-5 flex flex-col flex-grow justify-between">
                            <div>
                                <h4 class="text-lg font-serif font-bold text-stone-900 mb-1">${title}</h4>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-xl font-semibold text-rose-700">₹${price}</span>
                                    <span class="text-xs text-stone-500 bg-stone-100 px-2.5 py-1 rounded">Color: ${color}</span>
                                </div>
                                <div class="text-xs text-stone-600 space-y-1 mb-4">
                                    <p><strong class="text-stone-700">Sizes:</strong> ${sizes}</p>
                                    ${remarks ? `<p><strong class="text-stone-700">Remarks:</strong> ${remarks}</p>` : ''}
                                </div>
                            </div>
                            <a href="https://wa.me/919999999999?text=Hi,%20I%20am%20interested%20in%20ordering%20${encodeURIComponent(title)}%20(Price:%2520₹${price})" target="_blank" class="w-full bg-stone-900 text-white py-2.5 rounded-lg text-center font-medium hover:bg-stone-800 transition block text-sm">
                                Order via WhatsApp
                            </a>
                        </div>
                    `;
                    productGrid.appendChild(card);
                }
            } catch (error) {
                console.error('Error loading catalog:', error);
                document.getElementById('product-grid').innerHTML = '<p class="text-center col-span-full text-red-500">Failed to load catalog. Please check your products.csv file.</p>';
            }
        }

        loadCatalog();
    </script>
</body>
</html>

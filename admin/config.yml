backend:
  name: github
  repo: Swathiscloset/swathiscloset
  branch: main
  base_url: https://decap-cms-oauth.netlify.app
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Dresses & Catalog"
    folder: "_posts/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Dress Name", name: "title", widget: "string"}
      - {label: "Price (e.g. ₹2,499)", name: "price", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["Pastel Blue", "Emerald Green", "Silk", "Gowns"]}
      - {label: "Dress Photo", name: "image", widget: "image"}
      - {label: "Available Sizes", name: "sizes", widget: "list", default: ["S", "M", "L", "XL"]}
